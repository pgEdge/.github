# Org required workflow (ruleset r2). Lives in pgEdge/.github and runs on
# every pull request into a Tier 1-3 protected branch. It passes only when
# every other check run and commit status on the PR head commit has finished
# successfully. It does not require any particular job, or any CI at all:
# repos with no CI are reported by the compliance report instead.
# CodeRabbit is waited for, but only for CODERABBIT_WAIT seconds: it is
# rate-limited and sometimes never posts, and must not block a merge.
name: policy-ci-gate

on:
  pull_request:
  merge_group:

permissions:
  actions: read
  checks: read
  statuses: read
  contents: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Wait for all other checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          CODERABBIT_WAIT: 900
        run: |
          set -euo pipefail
          SELF_WORKFLOW=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id)
          start=$(date +%s)
          sleep 60   # let workflows triggered by the same push create their runs
          stable=0
          while :; do
            # GitHub Actions is judged by the newest run of each workflow on
            # the commit, leaving out this gate. One commit can get two runs
            # of a workflow, for example when a stack push moves a PR's head
            # and base together, and cancel-in-progress then cancels the
            # first. Only the newest run counts. A re-run updates its run, so
            # it counts too.
            wf=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              | jq -rs --argjson self "$SELF_WORKFLOW" '
                  [.[].workflow_runs[] | select(.workflow_id != $self)]
                  | group_by(.workflow_id)[] | max_by(.id)
                  | ["workflow", .name, .status, (.conclusion // "")] | @tsv')
            # Check runs from other apps, such as Codacy.
            checks=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.app.slug != "github-actions")
                    | ["check", .name, .status, (.conclusion // "")] | @tsv')
            stats=$(gh api "repos/$REPO/commits/$SHA/status?per_page=100" \
              --jq '.statuses[] | ["status", .context, .state] | @tsv')
            pending=0; failed=0
            while IFS=$'\t' read -r kind name status concl; do
              [ -z "$kind" ] && continue
              if [ "$status" != completed ]; then pending=1; continue; fi
              case "$concl" in
                success|neutral|skipped) ;;
                *) echo "::error::$kind '$name' concluded '$concl'"; failed=1 ;;
              esac
            done <<< "$wf"$'\n'"$checks"
            waited=$(( $(date +%s) - start ))
            while IFS=$'\t' read -r _ ctx state; do
              [ -z "$ctx" ] && continue
              if [ "$ctx" = CodeRabbit ] && [ "$state" = pending ] && [ "$waited" -ge "$CODERABBIT_WAIT" ]; then
                echo "::warning::CodeRabbit still pending after ${CODERABBIT_WAIT}s; not waiting for it"
                continue
              fi
              case "$state" in
                success) ;;
                pending) pending=1 ;;
                *) echo "::error::status '$ctx' is '$state'"; failed=1 ;;
              esac
            done <<< "$stats"
            [ "$failed" = 1 ] && exit 1
            if [ "$pending" = 0 ]; then
              stable=$((stable + 1))
              # Clean for three polls in a row (about 90s), so external CI
              # such as CircleCI that registers its status late is not missed.
              [ "$stable" -ge 3 ] && { echo "All checks passed."; exit 0; }
            else
              stable=0
            fi
            sleep 30
          done
