# Org required workflow (ruleset r2). Lives in pgEdge/.github and runs on
# every pull request into a Tier 1-3 protected branch. It passes only when
# every other check run and commit status on the PR head commit has finished
# successfully. It does not require any particular job, or any CI at all:
# repos with no CI are reported by the compliance report instead.
# CodeRabbit is waited for, but only for CODERABBIT_WAIT seconds: it is
# rate-limited and sometimes never posts, and must not block a merge.
name: policy-ci-gate

on:
  pull_request:
  merge_group:

permissions:
  actions: read
  checks: read
  statuses: read
  contents: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Wait for all other checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          CODERABBIT_WAIT: 900
        run: |
          set -euo pipefail
          # Checks are left out by check suite, not by name, so a repo job
          # that happens to be called ci-gate is still counted.
          read -r SELF_SUITE SELF_WORKFLOW < <(gh api "repos/$REPO/actions/runs/$RUN_ID" \
            --jq '"\(.check_suite_id) \(.workflow_id)"')
          start=$(date +%s)
          sleep 60   # let workflows triggered by the same push create their runs
          stable=0
          while :; do
            # Leave out every run of this gate on the commit, and any
            # cancelled run that a newer run of the same workflow replaced.
            # A push can deliver two pull_request events for one head commit,
            # for example when a stack moves a PR's head and base together,
            # and a workflow with cancel-in-progress then cancels its own
            # first run. That cancelled run is not a failure. A run cancelled
            # with no newer run behind it still is.
            #
            # Check runs are read before workflow runs. Concurrency creates
            # the newer run before it cancels the older one, so any check
            # already seen as cancelled has its replacement in the run list.
            # The replacement's own checks may not be in the earlier check
            # list yet, so any unfinished workflow run other than this gate
            # keeps the poll pending.
            all_runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | [(.check_suite.id | tostring), .app.slug, .name, .status, (.conclusion // "")] | @tsv')
            wf_runs=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | [.workflow_id, .id, (.conclusion // ""), .check_suite_id, .status] | @tsv')
            wf_pending=$(awk -F'\t' -v self="$SELF_WORKFLOW" \
              '$1 != "" && $1 != self && $5 != "completed" { p = 1 } END { print p + 0 }' <<< "$wf_runs")
            SKIP_SUITES=$(sort -t$'\t' -k1,1n -k2,2n <<< "$wf_runs" \
              | awk -F'\t' -v self="$SELF_WORKFLOW" '
                  $1 == self { print $4 }
                  $1 == prev && pconc == "cancelled" { print psuite }
                  { prev = $1; pconc = $3; psuite = $4 }' \
              | paste -sd, -)
            SKIP_SUITES="$SELF_SUITE${SKIP_SUITES:+,$SKIP_SUITES}"
            runs=$(awk -F'\t' -v OFS='\t' -v skip="$SKIP_SUITES" '
                BEGIN { n = split(skip, s, ","); for (i = 1; i <= n; i++) skipped[s[i]] = 1 }
                !($1 in skipped) { print $2, $3, $4, $5 }' <<< "$all_runs")
            stats=$(gh api "repos/$REPO/commits/$SHA/status?per_page=100" \
              --jq '.statuses[] | ["status", .context, .state] | @tsv')
            pending=$wf_pending; failed=0
            while IFS=$'\t' read -r app name status concl; do
              [ -z "$app" ] && continue
              if [ "$status" != completed ]; then pending=1; continue; fi
              case "$concl" in
                success|neutral|skipped) ;;
                *) echo "::error::check '$name' concluded '$concl'"; failed=1 ;;
              esac
            done <<< "$runs"
            waited=$(( $(date +%s) - start ))
            while IFS=$'\t' read -r _ ctx state; do
              [ -z "$ctx" ] && continue
              if [ "$ctx" = CodeRabbit ] && [ "$state" = pending ] && [ "$waited" -ge "$CODERABBIT_WAIT" ]; then
                echo "::warning::CodeRabbit still pending after ${CODERABBIT_WAIT}s; not waiting for it"
                continue
              fi
              case "$state" in
                success) ;;
                pending) pending=1 ;;
                *) echo "::error::status '$ctx' is '$state'"; failed=1 ;;
              esac
            done <<< "$stats"
            [ "$failed" = 1 ] && exit 1
            if [ "$pending" = 0 ]; then
              stable=$((stable + 1))
              # Clean for three polls in a row (about 90s), so external CI
              # such as CircleCI that registers its status late is not missed.
              [ "$stable" -ge 3 ] && { echo "All checks passed."; exit 0; }
            else
              stable=0
            fi
            sleep 30
          done
